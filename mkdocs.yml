site_name: ネットワーク及び演習 2026
site_url: https://sanoakr.github.io/rumath-network/
repo_url: https://github.com/sanoakr/rumath-network
repo_name: sanoakr/rumath-network
edit_uri: ""
copyright: 龍谷大学 先端理工学部 数理・情報科学課程

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: ja
  - include-markdown

# 各回のページは講義に合わせて順次追加する（未公開回はここに載せない）
nav:
  - ホーム: index.md
  - 教材ノートブック: notebooks.md
  - 講義内容と演習課題:
      - 事前課題 ex0: ex0.md
      - 第1回 ex1 (09/18): ex1.md
      - 第2回 ex2 (09/25): ex2.md
  - 環境構築:
      - Python のインストール: setup/python-install.md
  - ツール・サービス:
      - PC 画面のスクリーンショットを撮る: setup/screenshot.md
      - PC のデスクトップ録画: setup/screen-recording.md
      - Visual Studio Code と（日本語）文字コード: setup/vscode-encoding.md
      - paiza ラーニングでクーポンコードを使う: setup/paiza-coupon.md
      - GitHub Copilot の有効化・無効化: setup/github-copilot.md
  - この科目での質問方法: how-to-ask.md
